name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-visual-audit-repair:
    if: github.head_ref == 'diagnostic/production-runtime' && github.actor == 'JohnnyZLi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Patch the production visual audit and restore CI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/visual-audit.yml')
          text = path.read_text()

          old_ready = """          async function inspect(page, viewportName, prefix) {
            const problems = [];
            await page.screenshot({ path: `visual-audit/${prefix}-home-${viewportName}.png`, fullPage: true });
"""
          new_ready = """          async function inspect(page, viewportName, prefix) {
            const problems = [];
            await page.locator('.test-controls').waitFor({ state: 'visible' });
            await page.screenshot({ path: `visual-audit/${prefix}-home-${viewportName}.png`, fullPage: true });
"""
          old_profile = "new RegExp(`^${profile},`)"
          new_profile = "new RegExp(`^${profile}(?:,|$)`)"

          if old_ready not in text:
              raise SystemExit('Visual-audit readiness anchor was not found.')
          if text.count(old_profile) != 1:
              raise SystemExit('Expected exactly one profile-name selector.')

          path.write_text(text.replace(old_ready, new_ready, 1).replace(old_profile, new_profile, 1))
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/visual-audit.yml .github/workflows/ci.yml
          git commit -m "Harden production visual audit readiness"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  web:
    name: Web and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate pinned design-system assets
        run: npm run design-system:check
      - name: Validate design-system integration
        run: npm run design-system:integration
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .worker-bundle

  native-probe:
    name: ${{ matrix.label }} probe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11 x64
            os: windows-latest
            rid: win-x64
            binary: NetworkDeepProbe.exe
            package: zip
          - label: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            binary: NetworkDeepProbe
            package: tar
          - label: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            binary: NetworkDeepProbe
            package: tar
          - label: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            binary: NetworkDeepProbe
            package: tar
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64
            binary: NetworkDeepProbe
            package: tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Run probe tests on ${{ matrix.label }}
        run: dotnet test tools/DeepProbe.Tests/NetworkDeepProbe.Tests.csproj --configuration Release
      - name: Publish native self-contained executable
        run: dotnet publish tools/DeepProbe/NetworkDeepProbe.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}/publish
      - name: Stage distribution
        shell: bash
        run: |
          package="artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}"
          mkdir -p "$package"
          cp "artifacts/${{ matrix.rid }}/publish/${{ matrix.binary }}" "$package/${{ matrix.binary }}"
          cp LICENSE "$package/LICENSE.txt"
          cp tools/DeepProbe/DISTRIBUTION.md "$package/README.md"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$package/${{ matrix.binary }}"
          fi
      - name: Smoke-test native executable
        shell: bash
        run: artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}/${{ matrix.binary }} --help
      - name: Package Windows distribution
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $archive = "artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  NetworkDeepProbe-${{ matrix.rid }}.zip" | Out-File -Encoding ascii "$archive.sha256"
      - name: Package Unix distribution
        if: matrix.package == 'tar'
        shell: bash
        run: |
          archive="artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}.tar.gz"
          tar -C "artifacts/${{ matrix.rid }}" -czf "$archive" "NetworkDeepProbe-${{ matrix.rid }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "artifacts/${{ matrix.rid }}" && sha256sum "NetworkDeepProbe-${{ matrix.rid }}.tar.gz" > "NetworkDeepProbe-${{ matrix.rid }}.tar.gz.sha256")
          else
            (cd "artifacts/${{ matrix.rid }}" && shasum -a 256 "NetworkDeepProbe-${{ matrix.rid }}.tar.gz" > "NetworkDeepProbe-${{ matrix.rid }}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetworkDeepProbe-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/NetworkDeepProbe-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30
