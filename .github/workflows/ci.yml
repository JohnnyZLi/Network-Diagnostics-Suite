name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "contracts/**"
      - "infra/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "design-system.lock.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"
      - "wrangler.jsonc"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "contracts/**"
      - "infra/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "design-system.lock.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "vitest.config.*"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate pinned design-system assets
        run: npm run design-system:check
      - name: Validate design-system integration
        run: npm run design-system:integration
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .worker-bundle
