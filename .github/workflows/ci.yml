name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-visual-audit-repair:
    if: github.head_ref == 'fix/production-visual-audit' && github.actor == 'JohnnyZLi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Patch the production visual audit and restore CI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/visual-audit.yml')
          text = path.read_text()

          old_ready = """          async function inspect(page, viewportName, prefix) {
            const problems = [];
            await page.screenshot({ path: `visual-audit/${prefix}-home-${viewportName}.png`, fullPage: true });
"""
          new_ready = """          async function inspect(page, viewportName, prefix) {
            const problems = [];
            await page.locator('.test-controls').waitFor({ state: 'visible' });
            await page.screenshot({ path: `visual-audit/${prefix}-home-${viewportName}.png`, fullPage: true });
"""
          old_profile = "new RegExp(`^${profile},`)"
          new_profile = "new RegExp(`^${profile}(?:,|$)`)"

          if old_ready not in text:
              raise SystemExit('Visual-audit readiness anchor was not found.')
          if text.count(old_profile) != 1:
              raise SystemExit('Expected exactly one profile-name selector.')

          path.write_text(text.replace(old_ready, new_ready, 1).replace(old_profile, new_profile, 1))
          PY

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/visual-audit.yml .github/workflows/ci.yml
          git commit -m "Harden production visual audit readiness"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
