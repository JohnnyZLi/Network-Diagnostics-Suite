name: One-time sync attached menu motion

on:
  push:
    branches:
      - agent/sync-attached-menu-motion

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-attached-menu-motion
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Point Network Diagnostics at shared motion commit
        env:
          WDS_SOURCE_COMMIT: b1f0d464293625f6dae0928d46bf272620977252
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = os.environ['WDS_SOURCE_COMMIT']
          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = sha
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          source_path = Path('src/design-system/SOURCE.md')
          text = source_path.read_text()
          text, count = re.subn(r'Source commit: [0-9a-f]+', f'Source commit: {sha}', text, count=1)
          if count != 1:
              raise SystemExit('Could not update Network design-system source metadata')
          source_path.write_text(text)
          PY

      - name: Sync and validate shared assets
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:check
          npm run design-system:integration

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-sync-attached-menu-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync attached menu motion"
          git push origin HEAD:agent/sync-attached-menu-motion
