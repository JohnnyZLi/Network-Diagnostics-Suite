name: Desktop visual render

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-visual-render.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GTK_THEME: 'Adwaita:dark'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install Photino Linux host and virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev \
            xvfb openbox xdotool wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-visual/publish
          test -f desktop-visual/publish/wwwroot/index.html

      - name: Launch Photino desktop
        run: |
          mkdir -p desktop-visual/screenshots
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /tmp/desktop-xvfb.log 2>&1 &
          echo $! > /tmp/desktop-xvfb.pid
          sleep 1
          openbox > /tmp/desktop-openbox.log 2>&1 &
          echo $! > /tmp/desktop-openbox.pid
          desktop-visual/publish/NetworkDiagnosticsDesktop > /tmp/desktop-app.log 2>&1 &
          echo $! > /tmp/desktop-app.pid
          for attempt in {1..50}; do
            if wmctrl -l | grep -q 'Network Diagnostics'; then
              wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
              sleep 3
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/desktop-app.log
          exit 1

      - name: Capture Photino milestone states
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            sleep 0.7
            scrot "desktop-visual/screenshots/$1.png"
          }

          capture connection-check-wide

          wmctrl -r 'Network Diagnostics' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics' -e 0,100,80,1000,760
          capture connection-check-1000x760
          wmctrl -r 'Network Diagnostics' -e 0,150,100,820,700
          capture connection-check-820x700

          wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
          sleep 1

          # Focus order starts with History, then the settings gear.
          xdotool key --clearmodifiers Tab Tab Return
          capture settings-popover-dark
          xdotool key --clearmodifiers Escape

          # From the settings trigger: four profiles, three transfer methods, then Run.
          for _ in {1..8}; do
            xdotool key --clearmodifiers Tab
          done
          xdotool key --clearmodifiers Return
          sleep 0.2
          scrot desktop-visual/screenshots/connection-check-running-early.png
          sleep 1.3
          scrot desktop-visual/screenshots/connection-check-running-later.png
          sleep 6
          capture connection-check-complete

          if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
            cat /tmp/desktop-app.log
            exit 1
          fi
          if grep -Ei 'unhandled exception|fatal error|segmentation fault' /tmp/desktop-app.log; then
            cat /tmp/desktop-app.log
            exit 1
          fi

          reports_dir="$HOME/.local/share/NetworkDiagnostics/reports"
          test -d "$reports_dir"
          report_count=$(find "$reports_dir" -maxdepth 1 -type f -name '*-connection-check-*.json' | wc -l)
          if (( report_count < 1 )); then
            echo "Connection Check completed without persisting a report."
            find "$HOME/.local/share/NetworkDiagnostics" -maxdepth 3 -type f -print || true
            exit 1
          fi
          find "$reports_dir" -maxdepth 1 -type f -name '*.json' -print | sort > desktop-visual/report-files.txt

          # Async completion can move DOM focus. Click the known History control
          # in the maximized 1600x1000 audit viewport instead of assuming focus.
          xdotool mousemove --sync 1435 51 click 1
          capture saved-runs-panel

          # History can finish loading after focus was assigned, so click the actual
          # first report row instead of relying on transient Tab order.
          xdotool mousemove --sync 1315 205 click 1
          capture saved-report-detail

          # Real reports can contain one or many findings. Scroll the report pane to
          # its bottom before targeting the stable management action row.
          xdotool mousemove --sync 1400 760
          xdotool click --repeat 14 --delay 45 5
          capture saved-report-detail-bottom

          # Exercise the real report metadata workflow against the persisted JSON.
          xdotool mousemove --sync 1190 880 click 1
          capture saved-report-editor
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'CI baseline'
          xdotool key --clearmodifiers Tab
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'ci, photino'
          xdotool key --clearmodifiers Return
          capture saved-report-annotated

          latest_report=$(find "$reports_dir" -maxdepth 1 -type f -name '*-connection-check-*.json' -print0 \
            | xargs -0 ls -1t | head -n 1)
          python3 - "$latest_report" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as handle:
              document = json.load(handle)

          def objects(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from objects(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from objects(child)

          found = False
          for item in objects(document):
              normalized = {str(key).lower(): value for key, value in item.items()}
              if normalized.get('label') == 'CI baseline' and normalized.get('tags') == ['ci', 'photino']:
                  found = True
                  break

          if not found:
              raise SystemExit('Saved report metadata was not persisted to the JSON report.')
          PY

          xdotool key --clearmodifiers Escape

      - name: Upload rendered states
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: desktop-photino-visual-render
          path: |
            desktop-visual/screenshots
            desktop-visual/report-files.txt
            /tmp/desktop-app.log
            /tmp/desktop-openbox.log
            /tmp/desktop-xvfb.log
          retention-days: 7
