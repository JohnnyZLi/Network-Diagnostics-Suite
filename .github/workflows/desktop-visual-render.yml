name: Desktop visual render

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-visual-render.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-visual/publish

      - name: Launch virtual desktop
        run: |
          mkdir -p desktop-visual/screenshots
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /tmp/desktop-xvfb.log 2>&1 &
          echo $! > /tmp/desktop-xvfb.pid
          sleep 1
          openbox > /tmp/desktop-openbox.log 2>&1 &
          echo $! > /tmp/desktop-openbox.pid
          desktop-visual/publish/NetworkDiagnosticsDesktop > /tmp/desktop-app.log 2>&1 &
          echo $! > /tmp/desktop-app.pid
          for attempt in {1..40}; do
            if wmctrl -l | grep -q 'Network Diagnostics Suite'; then
              wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
              sleep 2
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/desktop-app.log
          exit 1

      - name: Capture desktop states
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            local name="$1"
            sleep 0.8
            scrot "desktop-visual/screenshots/${name}.png"
          }

          wait_for_window() {
            for attempt in {1..40}; do
              if wmctrl -l | grep -q 'Network Diagnostics Suite'; then
                wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
                sleep 1
                return
              fi
              sleep 0.5
            done
            cat /tmp/desktop-app.log
            exit 1
          }

          run_command() {
            local query="$1"
            xdotool key --clearmodifiers ctrl+k
            sleep 0.25
            xdotool type --delay 12 "$query"
            sleep 0.2
            xdotool key Return
            sleep 0.6
          }

          capture overview-dark-wide

          # Selecting a preset must update the plan and Run label without starting a test.
          run_command 'select full diagnostic'
          capture diagnostic-selector-full
          run_command 'select stress diagnostic'
          capture diagnostic-selector-stress
          run_command 'select quick diagnostic'

          # Audit every profile in the actual opened configurator.
          run_command 'customize diagnostic'
          xdotool mousemove 470 525 click 1
          capture configurator-dark-quick
          xdotool mousemove 470 595 click 1
          capture configurator-dark-full
          xdotool mousemove 470 665 click 1
          capture configurator-dark-stress
          xdotool mousemove 470 455 click 1
          capture configurator-dark-connection
          xdotool mousemove 470 525 click 1

          # Verify the same sheet at compact desktop window sizes.
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,1000,760
          capture configurator-dark-compact
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,900,700
          capture configurator-dark-900x700
          wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
          sleep 1
          xdotool mousemove 70 500 click 1

          # Closing and reopening must preserve the complete action footer.
          run_command 'customize diagnostic'
          capture configurator-dark-reopened
          xdotool key Escape
          sleep 0.4

          xdotool key --clearmodifiers End
          capture control-center-recent-diagnostics
          xdotool key --clearmodifiers Home

          run_command 'open comparisons'
          xdotool key --clearmodifiers End
          capture control-center-inline-compare
          xdotool key --clearmodifiers Home

          # Clicking the command-palette backdrop must dismiss it without another shortcut.
          xdotool key --clearmodifiers ctrl+k
          sleep 0.35
          capture command-palette
          xdotool mousemove 40 560 click 1
          capture command-palette-dismissed

          run_command 'open reports'
          capture diagnostics-library-empty

          # Saved-report chrome must stay inside a bounded sheet with persistent shell navigation.
          run_command 'preview saved report'
          capture saved-report-detail
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,1000,760
          capture saved-report-detail-compact
          wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
          sleep 0.8
          run_command 'open network overview'

          # Settings should open over the stable Home shell without first replacing the page.
          for section in general monitoring diagnostics privacy storage developer; do
            run_command "settings ${section}"
            capture "settings-${section}"
          done

          run_command 'settings general'
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,1000,760
          capture settings-general-compact
          wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
          sleep 0.8
          run_command 'settings general'
          xdotool mousemove 760 470 click 1
          capture settings-interface-dropdown
          xdotool key Escape
          xdotool mousemove 12 500 click 1
          capture overview-after-settings

          # Keep the legacy presentation fixture available for isolated result-state review.
          run_command 'preview healthy result'
          capture result-healthy-overview
          xdotool mousemove 255 215 click 1
          capture result-healthy-evidence
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,1000,760
          capture result-healthy-evidence-compact
          wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
          sleep 0.8

          # A just-completed result must use the same bounded report sheet as history,
          # with current-run actions rather than replacing the whole control center.
          run_command 'open network overview'
          run_command 'preview current result'
          capture current-result-detail
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,80,70,1000,760
          capture current-result-detail-compact
          wmctrl -r 'Network Diagnostics Suite' -b add,maximized_vert,maximized_horz
          sleep 0.8
          run_command 'open network overview'

          # Exercise a live diagnostic over several telemetry updates. These frames
          # verify that the Tests & diagnostics region becomes a stable live tile
          # instead of navigating to a separate running page.
          run_command 'run selected diagnostic'
          capture running-diagnostic-live-1
          capture running-diagnostic-live-2
          capture running-diagnostic-live-3
          xdotool key Escape || true

          run_command 'open network overview'
          wmctrl -r 'Network Diagnostics Suite' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics Suite' -e 0,40,40,1100,800
          capture overview-1100x800
          wmctrl -r 'Network Diagnostics Suite' -e 0,40,40,900,700
          capture overview-900x700

          # Restart from a clean control-center destination in Light mode.
          kill "$(cat /tmp/desktop-app.pid)" || true
          sleep 1
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path.home() / '.local' / 'share' / 'JohnnyLi' / 'NetworkDiagnostics' / 'settings.json'
          data = json.loads(path.read_text()) if path.exists() else {}
          data['appearance'] = 'light'
          data['workbench'] = None
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, indent=2))
          PY
          desktop-visual/publish/NetworkDiagnosticsDesktop >> /tmp/desktop-app.log 2>&1 &
          echo $! > /tmp/desktop-app.pid
          wait_for_window
          run_command 'open network overview'
          capture overview-light-wide
          run_command 'customize diagnostic'
          xdotool mousemove 470 525 click 1
          capture configurator-light-quick
          xdotool mousemove 470 665 click 1
          capture configurator-light-stress

      - name: Upload rendered desktop states
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: desktop-visual-render
          path: |
            desktop-visual/screenshots
            /tmp/desktop-app.log
            /tmp/desktop-openbox.log
            /tmp/desktop-xvfb.log
          retention-days: 7
