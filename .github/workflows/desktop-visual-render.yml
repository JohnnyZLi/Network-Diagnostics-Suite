name: Desktop visual render

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-visual-render.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GTK_THEME: 'Adwaita:dark'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install Photino Linux host and virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev \
            xvfb openbox xdotool wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-visual/publish
          test -f desktop-visual/publish/wwwroot/index.html

      - name: Launch Photino desktop
        run: |
          mkdir -p desktop-visual/screenshots
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /tmp/desktop-xvfb.log 2>&1 &
          echo $! > /tmp/desktop-xvfb.pid
          sleep 1
          openbox > /tmp/desktop-openbox.log 2>&1 &
          echo $! > /tmp/desktop-openbox.pid
          desktop-visual/publish/NetworkDiagnosticsDesktop > /tmp/desktop-app.log 2>&1 &
          echo $! > /tmp/desktop-app.pid
          for attempt in {1..50}; do
            if wmctrl -l | grep -q 'Network Diagnostics'; then
              wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
              sleep 3
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/desktop-app.log
          exit 1

      - name: Capture Photino milestone states
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            sleep 0.7
            scrot "desktop-visual/screenshots/$1.png"
          }

          capture connection-check-wide

          wmctrl -r 'Network Diagnostics' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics' -e 0,100,80,1000,760
          capture connection-check-1000x760
          wmctrl -r 'Network Diagnostics' -e 0,150,100,820,700
          capture connection-check-820x700

          wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
          sleep 1

          # WebKitGTK does not assign initial keyboard focus to the toolbar reliably.
          # Click the stable controls in the fixed 1600x1000 audit viewport instead.
          # The monitor also performs a native snapshot request on open, so give the
          # workspace enough time to mount and receive that snapshot before capture.
          xdotool mousemove --sync 1346 52 click 1
          sleep 2
          scrot desktop-visual/screenshots/network-monitor-dark.png
          xdotool key --clearmodifiers Escape

          xdotool mousemove --sync 1565 52 click 1
          capture settings-popover-dark

          # Advanced diagnostics is appended below the unchanged appearance controls
          # in the settings popover. Open the dedicated side workspace, exercise the
          # real native preflight path, and verify that the advanced configuration is
          # persisted by the .NET settings store rather than only held in React state.
          xdotool mousemove --sync 1440 220 click 1
          sleep 1.5
          scrot desktop-visual/screenshots/advanced-diagnostics-dark.png

          # The Advanced footer is pinned to the bottom of the fixed audit viewport.
          # Run preflight using the default first-party endpoint and automatic route.
          xdotool mousemove --sync 1400 968 click 1
          sleep 7
          scrot desktop-visual/screenshots/advanced-preflight-dark.png

          settings_path="$HOME/.local/share/NetworkDiagnostics/desktop-settings.json"
          test -f "$settings_path"
          python3 - "$settings_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              settings = json.load(handle)

          expected = {
              'includeLocalIdentifiers': False,
              'lanPort': 8765,
              'lanDurationSeconds': 8,
              'lanConnections': 4,
          }
          for key, value in expected.items():
              if settings.get(key) != value:
                  raise SystemExit(f'Advanced setting {key} was not persisted as expected: {settings.get(key)!r}')
          if settings.get('testOrigins') not in ([], None):
              raise SystemExit(f'Unexpected default endpoint candidates: {settings.get("testOrigins")!r}')
          PY

          xdotool key --clearmodifiers Escape

          # Re-open Monitor and launch its Content speed check. This replaces the
          # old fixed main-button click so the same real run/report gate proves the
          # utility shortcut selects Connection Check + Aggregate in the native host.
          xdotool mousemove --sync 1346 52 click 1
          sleep 2
          scrot desktop-visual/screenshots/network-monitor-utilities-dark.png
          # Target the explicit Run affordance at the far-right edge of the Content
          # card. It is more stable than the card center under WebKit text reflow.
          xdotool mousemove --sync 1213 831 click 1
          sleep 0.3
          scrot desktop-visual/screenshots/content-speed-running-early.png
          sleep 1.3
          scrot desktop-visual/screenshots/content-speed-running-later.png

          for attempt in {1..20}; do
            if grep -Fq '"profile":"connection-check","method":"aggregate","transferCapBytes"' /tmp/desktop-app.log; then
              break
            fi
            if (( attempt == 20 )); then
              echo "Monitor Content shortcut did not start Connection Check + Aggregate."
              tail -120 /tmp/desktop-app.log
              exit 1
            fi
            sleep 0.25
          done

          sleep 5
          capture connection-check-complete

          if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
            cat /tmp/desktop-app.log
            exit 1
          fi
          if grep -Ei 'unhandled exception|fatal error|segmentation fault' /tmp/desktop-app.log; then
            cat /tmp/desktop-app.log
            exit 1
          fi

          reports_dir="$HOME/.local/share/NetworkDiagnostics/reports"
          test -d "$reports_dir"
          report_count=$(find "$reports_dir" -maxdepth 1 -type f -name '*-connection-check-*.json' | wc -l)
          if (( report_count < 1 )); then
            echo "Connection Check completed without persisting a report."
            find "$HOME/.local/share/NetworkDiagnostics" -maxdepth 3 -type f -print || true
            exit 1
          fi
          find "$reports_dir" -maxdepth 1 -type f -name '*.json' -print | sort > desktop-visual/report-files.txt

          # Open History through its stable toolbar position, then open the first
          # persisted report row once the panel has rendered.
          xdotool mousemove --sync 1479 52 click 1
          capture saved-runs-panel

          xdotool mousemove --sync 1315 205 click 1
          capture saved-report-detail

          # Real reports can contain one or many findings. Scroll the report pane to
          # its bottom before targeting the stable management action row.
          xdotool mousemove --sync 1400 760
          xdotool click --repeat 14 --delay 45 5
          capture saved-report-detail-bottom

          # Exercise the real report metadata workflow against the persisted JSON.
          # These coordinates come from the actual 1600x1000 rendered state. Avoid
          # WebKit focus-order assumptions for the editor inputs and save action too.
          xdotool mousemove --sync 1241 957 click 1
          capture saved-report-editor

          xdotool mousemove --sync 1260 303 click 1
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'CI baseline'

          xdotool mousemove --sync 1260 404 click 1
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'ci, photino'

          xdotool mousemove --sync 1520 957 click 1
          capture saved-report-annotated

          python3 - "$reports_dir" <<'PY'
          import glob
          import json
          import os
          import sys

          reports_dir = sys.argv[1]

          def objects(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from objects(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from objects(child)

          found = False
          for path in glob.glob(os.path.join(reports_dir, '*-connection-check-*.json')):
              with open(path, encoding='utf-8') as handle:
                  document = json.load(handle)
              for item in objects(document):
                  normalized = {str(key).lower(): value for key, value in item.items()}
                  if normalized.get('label') == 'CI baseline' and normalized.get('tags') == ['ci', 'photino']:
                      found = True
                      break
              if found:
                  break

          if not found:
              raise SystemExit('Saved report metadata was not persisted to the JSON report.')
          PY

          xdotool key --clearmodifiers Escape

      - name: Upload rendered states
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: desktop-photino-visual-render
          path: |
            desktop-visual/screenshots
            desktop-visual/report-files.txt
            /tmp/desktop-app.log
            /tmp/desktop-openbox.log
            /tmp/desktop-xvfb.log
          retention-days: 7
