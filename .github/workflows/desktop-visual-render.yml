name: Desktop visual render

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-visual-render.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GTK_THEME: 'Adwaita:dark'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install Photino Linux host and virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev \
            xvfb openbox xdotool wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-visual/publish
          test -f desktop-visual/publish/wwwroot/index.html

      - name: Launch Photino desktop
        run: |
          mkdir -p desktop-visual/screenshots
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /tmp/desktop-xvfb.log 2>&1 &
          echo $! > /tmp/desktop-xvfb.pid
          sleep 1
          openbox > /tmp/desktop-openbox.log 2>&1 &
          echo $! > /tmp/desktop-openbox.pid
          desktop-visual/publish/NetworkDiagnosticsDesktop > /tmp/desktop-app.log 2>&1 &
          echo $! > /tmp/desktop-app.pid
          for attempt in {1..50}; do
            if wmctrl -l | grep -q 'Network Diagnostics'; then
              wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
              sleep 3
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/desktop-app.log
          exit 1

      - name: Capture Photino milestone states
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            sleep 0.7
            scrot "desktop-visual/screenshots/$1.png"
          }

          open_palette() {
            # WebKitGTK needs explicit content focus under Xvfb before Ctrl-F.
            xdotool mousemove --sync 800 330 click 1
            sleep 0.15
            xdotool key --clearmodifiers ctrl+f
            sleep 0.45
          }

          capture network-workbench-wide

          wmctrl -r 'Network Diagnostics' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics' -e 0,100,80,1000,760
          capture network-workbench-1000x760
          wmctrl -r 'Network Diagnostics' -e 0,150,100,820,700
          capture network-workbench-820x700

          wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
          sleep 1

          # Continuous diagnostics is part of the main page now. The palette command
          # is a navigation jump rather than a side-workspace launcher.
          open_palette
          capture command-palette-dark
          xdotool type --delay 35 'monitor'
          capture command-palette-monitor-filtered
          xdotool key --clearmodifiers Return
          sleep 1.5
          capture continuous-diagnostics-dark

          # Advanced diagnostics is likewise a visible workbench section rather than
          # being hidden under Settings. Prove the keyboard navigation lands there.
          open_palette
          xdotool type --delay 35 'advanced'
          capture command-palette-advanced-filtered
          xdotool key --clearmodifiers Return
          sleep 1.5
          capture advanced-diagnostics-dark

          # Exercise the relocated native preflight in-place. The coordinates target
          # the Preflight tab and its Run preflight button in the fixed 1600x1000 gate.
          xdotool mousemove --sync 1120 608 click 1
          capture advanced-preflight-ready-dark
          xdotool mousemove --sync 300 755 click 1
          for attempt in {1..24}; do
            if grep -Fq '"payload":{"measurement":{"contractVersion":"1.1"' /tmp/desktop-app.log; then
              break
            fi
            if (( attempt == 24 )); then
              echo "Inline Advanced preflight did not return the native measurement contract."
              tail -120 /tmp/desktop-app.log
              exit 1
            fi
            sleep 0.5
          done
          capture advanced-preflight-dark

          # Settings is intentionally application preferences only. Focus an inert
          # WebView background area before Ctrl-Home so the key scrolls the document
          # rather than an input, then open the compact appearance popover.
          xdotool mousemove --sync 80 500 click 1
          xdotool key --clearmodifiers ctrl+home
          sleep 0.8
          xdotool mousemove --sync 1085 52 click 1
          capture settings-popover-dark
          xdotool key --clearmodifiers Escape

          # Launch the low-data Content shortcut semantically through the palette.
          # This should select Connection Check + Aggregate in the native host and
          # return the viewport to the active diagnostic hero.
          open_palette
          xdotool type --delay 35 'content speed'
          capture command-palette-content-filtered
          xdotool key --clearmodifiers Return
          sleep 0.3
          capture content-speed-running-early
          sleep 1.3
          capture content-speed-running-later

          for attempt in {1..20}; do
            if grep -Fq '"profile":"connection-check","method":"aggregate","transferCapBytes"' /tmp/desktop-app.log; then
              break
            fi
            if (( attempt == 20 )); then
              echo "Content shortcut did not start Connection Check + Aggregate."
              tail -120 /tmp/desktop-app.log
              exit 1
            fi
            sleep 0.25
          done

          # Transfer progress can reach 100% before final native evidence collection.
          # Treat the persisted schema-2 report as the completion condition.
          reports_dir="$HOME/.local/share/NetworkDiagnostics/reports"
          for attempt in {1..90}; do
            if find "$reports_dir" -maxdepth 1 -type f -name '*-connection-check-*.json' -print -quit 2>/dev/null | grep -q .; then
              break
            fi
            if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-app.log
              exit 1
            fi
            if (( attempt == 90 )); then
              echo "Connection Check did not finish and persist a report within 90 seconds."
              tail -160 /tmp/desktop-app.log
              exit 1
            fi
            sleep 1
          done

          capture connection-check-complete

          if ! kill -0 "$(cat /tmp/desktop-app.pid)" 2>/dev/null; then
            cat /tmp/desktop-app.log
            exit 1
          fi
          if grep -Ei 'unhandled exception|fatal error|segmentation fault' /tmp/desktop-app.log; then
            cat /tmp/desktop-app.log
            exit 1
          fi

          test -d "$reports_dir"
          report_count=$(find "$reports_dir" -maxdepth 1 -type f -name '*-connection-check-*.json' | wc -l)
          if (( report_count < 1 )); then
            echo "Connection Check completed without persisting a report."
            find "$HOME/.local/share/NetworkDiagnostics" -maxdepth 3 -type f -print || true
            exit 1
          fi
          find "$reports_dir" -maxdepth 1 -type f -name '*.json' -print | sort > desktop-visual/report-files.txt

          # History remains the one full side workspace. Its shortcut avoids coupling
          # this gate to toolbar geometry after removing the old Monitor button.
          xdotool key --clearmodifiers ctrl+h
          capture saved-runs-panel

          xdotool mousemove --sync 1315 205 click 1
          capture saved-report-detail

          # Findings vary by live run, so scroll the report pane before targeting the
          # action row. These editor hit points are the previously proven 1600x1000
          # coordinates for the fixed History workspace.
          xdotool mousemove --sync 1400 760
          xdotool click --repeat 14 --delay 45 5
          capture saved-report-detail-bottom

          xdotool mousemove --sync 1242 916 click 1
          capture saved-report-editor

          xdotool mousemove --sync 1260 325 click 1
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'CI baseline'

          xdotool mousemove --sync 1260 425 click 1
          xdotool key --clearmodifiers ctrl+a
          xdotool type --delay 20 'ci, photino'

          xdotool mousemove --sync 1525 956 click 1
          capture saved-report-annotated

          python3 - "$reports_dir" <<'PY'
          import glob
          import json
          import os
          import sys

          reports_dir = sys.argv[1]

          def objects(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from objects(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from objects(child)

          found = False
          for path in glob.glob(os.path.join(reports_dir, '*-connection-check-*.json')):
              with open(path, encoding='utf-8') as handle:
                  document = json.load(handle)
              for item in objects(document):
                  normalized = {str(key).lower(): value for key, value in item.items()}
                  if normalized.get('label') == 'CI baseline' and normalized.get('tags') == ['ci', 'photino']:
                      found = True
                      break
              if found:
                  break

          if not found:
              raise SystemExit('Saved report metadata was not persisted to the JSON report.')
          PY

          xdotool key --clearmodifiers Escape

      - name: Upload rendered states
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-photino-visual-render
          path: |
            desktop-visual/screenshots
            desktop-visual/report-files.txt
            /tmp/desktop-app.log
            /tmp/desktop-openbox.log
            /tmp/desktop-xvfb.log
          retention-days: 7