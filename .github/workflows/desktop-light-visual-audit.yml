name: Desktop Light visual audit

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-light-visual-audit.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GTK_THEME: 'Adwaita'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install Photino Linux host and virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb openbox xdotool wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-light/publish
          test -f desktop-light/publish/wwwroot/index.html

      - name: Launch Light Photino desktop
        run: |
          mkdir -p desktop-light/screenshots
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /tmp/desktop-light-xvfb.log 2>&1 &
          echo $! > /tmp/desktop-light-xvfb.pid
          sleep 1
          openbox > /tmp/desktop-light-openbox.log 2>&1 &
          echo $! > /tmp/desktop-light-openbox.pid
          desktop-light/publish/NetworkDiagnosticsDesktop > /tmp/desktop-light-app.log 2>&1 &
          echo $! > /tmp/desktop-light-app.pid
          for attempt in {1..50}; do
            if wmctrl -l | grep -q 'Network Diagnostics'; then
              wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
              sleep 3
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/desktop-light-app.pid)" 2>/dev/null; then
              cat /tmp/desktop-light-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/desktop-light-app.log
          exit 1

      - name: Capture Light milestone states
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            sleep 0.7
            scrot "desktop-light/screenshots/$1.png"
          }

          capture connection-check-light-wide
          wmctrl -r 'Network Diagnostics' -b remove,maximized_vert,maximized_horz
          wmctrl -r 'Network Diagnostics' -e 0,100,80,1000,760
          capture connection-check-light-compact

          if ! kill -0 "$(cat /tmp/desktop-light-app.pid)" 2>/dev/null; then
            cat /tmp/desktop-light-app.log
            exit 1
          fi
          if grep -Ei 'unhandled exception|fatal error|segmentation fault' /tmp/desktop-light-app.log; then
            cat /tmp/desktop-light-app.log
            exit 1
          fi

      - name: Upload Light rendered states
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: desktop-photino-light-visual-audit
          path: |
            desktop-light/screenshots
            /tmp/desktop-light-app.log
            /tmp/desktop-light-openbox.log
            /tmp/desktop-light-xvfb.log
          retention-days: 7
