name: Desktop app

on:
  push:
    branches: [main]
    tags:
      - "desktop-v*"
    paths:
      - ".github/workflows/desktop.yml"
      - "contracts/**"
      - "tools/DeepProbe/**"
      - "tools/NetworkDiagnostics.Core/**"
      - "tools/NetworkDiagnostics.Desktop/**"
      - "tools/NetworkDiagnostics.Desktop.Tests/**"
      - "package.json"
      - "package-lock.json"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "contracts/**"
      - "tools/DeepProbe/**"
      - "tools/NetworkDiagnostics.Core/**"
      - "tools/NetworkDiagnostics.Desktop/**"
      - "tools/NetworkDiagnostics.Desktop.Tests/**"
      - "package.json"
      - "package-lock.json"
      - "Directory.Build.*"
      - "global.json"
      - "NuGet.config"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-app:
    name: ${{ matrix.label }} desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11 x64
            os: windows-latest
            rid: win-x64
            binary: NetworkDiagnosticsDesktop.exe
            package: zip
            mac_bundle: false
          - label: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            binary: NetworkDiagnosticsDesktop
            package: tar
            mac_bundle: true
          - label: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            binary: NetworkDiagnosticsDesktop
            package: tar
            mac_bundle: true
          - label: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            binary: NetworkDiagnosticsDesktop
            package: tar
            mac_bundle: false
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64
            binary: NetworkDiagnosticsDesktop
            package: tar
            mac_bundle: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test desktop frontend interactions
        run: npm run desktop:web:test
      - uses: actions/setup-dotnet@c97148f4733f57845eed08c03153ce9975bd616a # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test desktop bridge contract
        run: dotnet test tools/NetworkDiagnostics.Desktop.Tests/NetworkDiagnostics.Desktop.Tests.csproj --configuration Release
      - name: Resolve desktop version
        id: desktop-version
        shell: bash
        run: |
          version="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Desktop release tags must use desktop-v<semver>; received $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Publish desktop application
        run: dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/desktop-${{ matrix.rid }}/publish /p:Version=${{ steps.desktop-version.outputs.value }}
      - name: Smoke-test desktop bootstrap
        shell: bash
        run: artifacts/desktop-${{ matrix.rid }}/publish/${{ matrix.binary }} --smoke-test
      - name: Stage desktop distribution
        shell: bash
        run: |
          package="artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}"
          mkdir -p "$package"
          cp LICENSE "$package/LICENSE.txt"
          cp tools/NetworkDiagnostics.Desktop/DISTRIBUTION.md "$package/README.md"

          if [ "${{ matrix.mac_bundle }}" = "true" ]; then
            app="$package/Network Diagnostics.app"
            tools/NetworkDiagnostics.Desktop/package-macos-app.sh \
              "artifacts/desktop-${{ matrix.rid }}/publish" \
              "$app" \
              "${{ steps.desktop-version.outputs.value }}" \
              "${{ github.run_number }}"
          else
            cp -R "artifacts/desktop-${{ matrix.rid }}/publish/." "$package/"
            if [ "${{ runner.os }}" != "Windows" ]; then
              chmod +x "$package/${{ matrix.binary }}"
            fi
          fi
      - name: Validate packaged frontend
        shell: bash
        run: |
          if [ "${{ matrix.mac_bundle }}" = "true" ]; then
            test -f "artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}/Network Diagnostics.app/Contents/MacOS/wwwroot/index.html"
          else
            test -f "artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}/wwwroot/index.html"
          fi
      - name: Validate macOS application bundle
        if: matrix.mac_bundle
        shell: bash
        run: |
          app="artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}/Network Diagnostics.app"
          test -x "$app/Contents/MacOS/NetworkDiagnosticsDesktop"
          test -f "$app/Contents/MacOS/wwwroot/index.html"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -lint "$app/Contents/Info.plist"
      - name: Package Windows desktop distribution
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $archive = "artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  NetworkDiagnosticsDesktop-${{ matrix.rid }}.zip" | Out-File -Encoding ascii "$archive.sha256"
      - name: Package Unix desktop distribution
        if: matrix.package == 'tar'
        shell: bash
        run: |
          archive="artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}.tar.gz"
          tar -C "artifacts/desktop-${{ matrix.rid }}" -czf "$archive" "NetworkDiagnosticsDesktop-${{ matrix.rid }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "artifacts/desktop-${{ matrix.rid }}" && sha256sum "NetworkDiagnosticsDesktop-${{ matrix.rid }}.tar.gz" > "NetworkDiagnosticsDesktop-${{ matrix.rid }}.tar.gz.sha256")
          else
            (cd "artifacts/desktop-${{ matrix.rid }}" && shasum -a 256 "NetworkDiagnosticsDesktop-${{ matrix.rid }}.tar.gz" > "NetworkDiagnosticsDesktop-${{ matrix.rid }}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetworkDiagnosticsDesktop-${{ matrix.rid }}
          path: artifacts/desktop-${{ matrix.rid }}/NetworkDiagnosticsDesktop-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NetworkDiagnosticsDesktop-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            extension="tar.gz"
            if [ "$rid" = "win-x64" ]; then
              extension="zip"
            fi
            archive="release-assets/NetworkDiagnosticsDesktop-$rid.$extension"
            test -f "$archive"
            test -f "$archive.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Network Diagnostics Desktop $version" \
            --generate-notes
