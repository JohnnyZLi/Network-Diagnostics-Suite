name: Apply source patch

on:
  push:
    branches:
      - agent/desktop-app-rebuild
    paths:
      - '.automation/source.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/desktop-app-rebuild
          fetch-depth: 0
      - name: Apply validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index .automation/source.patch
          git rm .automation/source.patch
          git commit -m "Apply validated implementation tranche"
          git push origin HEAD:agent/desktop-app-rebuild
