name: Apply final design-system sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/fix-attached-control-visuals'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/fix-attached-control-visuals
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run design-system:sync
      - run: npm run design-system:check
      - run: npm run design-system:integration
      - run: rm -f .github/workflows/apply-final-design-system-sync.yml
      - name: Commit generated final sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync final attached header controls"
          git push origin HEAD:agent/fix-attached-control-visuals
