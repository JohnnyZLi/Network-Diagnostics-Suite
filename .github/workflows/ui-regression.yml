name: UI regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-card-and-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/network-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/network-preview.log
          exit 1
      - name: Verify hero, result-card, and confirmation behavior
        run: |
          mkdir -p ui-regression
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const confirmationKey = 'network-diagnostics.data-confirmations.v1';
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          const readHeroGeometry = async (page) => page.evaluate(() => {
            const hero = document.querySelector('.hero');
            const copy = document.querySelector('.hero__copy');
            const controls = document.querySelector('.test-controls');
            if (!(hero instanceof HTMLElement) || !(copy instanceof HTMLElement) || !(controls instanceof HTMLElement)) return null;
            const heroRect = hero.getBoundingClientRect();
            const copyRect = copy.getBoundingClientRect();
            const controlsRect = controls.getBoundingClientRect();
            const copyStyle = getComputedStyle(copy);
            return {
              heroTop: heroRect.top,
              heroBottom: heroRect.bottom,
              heroHeight: heroRect.height,
              copyTop: copyRect.top,
              copyBottom: copyRect.bottom,
              copyHeight: copyRect.height,
              controlsTop: controlsRect.top,
              controlsBottom: controlsRect.bottom,
              position: copyStyle.position,
              stickyTop: Number.parseFloat(copyStyle.top),
              scrollY: window.scrollY,
            };
          });

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];

            for (const [name, viewport] of viewports) {
              const context = await browser.newContext({ viewport, reducedMotion: 'reduce' });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

              const heroInitial = await readHeroGeometry(page);
              if (!heroInitial) {
                failures.push(`${name}: hero geometry did not render`);
              } else if (name === 'desktop') {
                if (Math.abs(heroInitial.copyTop - heroInitial.controlsTop) > 1) {
                  failures.push(`desktop: hero copy top ${heroInitial.copyTop}px does not align with controls top ${heroInitial.controlsTop}px`);
                }
                if (heroInitial.position !== 'sticky') failures.push(`desktop: hero copy position is ${heroInitial.position}, expected sticky`);
                if (!Number.isFinite(heroInitial.stickyTop)) failures.push('desktop: sticky top could not be resolved');

                const stickyScroll = Math.max(0, heroInitial.copyTop - heroInitial.stickyTop) + 80;
                await page.evaluate((scrollY) => window.scrollTo(0, scrollY), stickyScroll);
                await page.waitForTimeout(100);
                const heroSticky = await readHeroGeometry(page);
                if (!heroSticky) {
                  failures.push('desktop: sticky hero geometry disappeared');
                } else {
                  if (Math.abs(heroSticky.copyTop - heroInitial.stickyTop) > 1) {
                    failures.push(`desktop: hero copy settled at ${heroSticky.copyTop}px instead of sticky top ${heroInitial.stickyTop}px`);
                  }
                  if (heroSticky.controlsTop >= heroSticky.copyTop - 16) {
                    failures.push('desktop: Test profile panel did not continue scrolling past the sticky hero copy');
                  }
                }
                await page.screenshot({ path: 'ui-regression/hero-sticky-desktop.png' });

                const releaseScroll = heroInitial.heroTop + heroInitial.heroHeight - 40;
                await page.evaluate((scrollY) => window.scrollTo(0, scrollY), releaseScroll);
                await page.waitForTimeout(100);
                const heroRelease = await readHeroGeometry(page);
                if (!heroRelease) {
                  failures.push('desktop: bounded hero geometry disappeared');
                } else {
                  if (heroRelease.copyBottom > heroRelease.heroBottom + 1) {
                    failures.push('desktop: sticky hero copy escaped its hero section');
                  }
                  if (heroRelease.copyTop >= heroInitial.stickyTop - 1) {
                    failures.push('desktop: hero copy did not release near the end of its section');
                  }
                }
                await page.screenshot({ path: 'ui-regression/hero-release-desktop.png' });
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForTimeout(50);
              } else if (heroInitial.position !== 'static') {
                failures.push(`mobile: hero copy position is ${heroInitial.position}, expected static`);
              }

              const geometry = await page.evaluate(() => {
                const wrapper = document.createElement('div');
                wrapper.style.width = 'min(680px, calc(100vw - 32px))';
                wrapper.style.margin = '24px auto';
                wrapper.innerHTML = `
                  <article class="metric-card metric-card--blue" data-regression-card>
                    <div class="metric-card__header"><span>Download</span><span class="metric-card__dot"></span></div>
                    <div class="metric-card__reading"><strong>325</strong><span>Mbps</span></div>
                    <div class="metric-card__detail">325 median whole-sample · 3 samples · 78% median stability · 490.1 MB with deliberately extended wrapping copy</div>
                    <svg class="sparkline" viewBox="0 0 360 92" preserveAspectRatio="none" aria-label="Download throughput">
                      <path class="sparkline__grid" d="M0 23H360M0 46H360M0 69H360"></path>
                      <polyline points="0,72 45,20 90,60 135,25 180,70 225,28 270,65 315,24 360,58" fill="none" stroke="var(--blue)" stroke-width="2.5"></polyline>
                    </svg>
                  </article>`;
                document.querySelector('main')?.prepend(wrapper);
                const card = wrapper.querySelector('[data-regression-card]');
                const detail = card?.querySelector('.metric-card__detail');
                const sparkline = card?.querySelector('.sparkline');
                if (!(card instanceof HTMLElement) || !(detail instanceof HTMLElement) || !(sparkline instanceof SVGElement)) return null;
                const cardRect = card.getBoundingClientRect();
                const detailRect = detail.getBoundingClientRect();
                const sparklineRect = sparkline.getBoundingClientRect();
                return {
                  detailBottom: detailRect.bottom,
                  sparklineTop: sparklineRect.top,
                  gap: sparklineRect.top - detailRect.bottom,
                  cardBottom: cardRect.bottom,
                  sparklineBottom: sparklineRect.bottom,
                };
              });

              if (!geometry) {
                failures.push(`${name}: metric-card fixture did not render`);
              } else {
                if (geometry.gap < 8) failures.push(`${name}: metric detail and sparkline gap is ${geometry.gap}px`);
                if (geometry.sparklineBottom > geometry.cardBottom + 1) failures.push(`${name}: sparkline escaped the metric card`);
              }

              await page.locator('[data-regression-card]').screenshot({ path: `ui-regression/metric-card-${name}.png` });
              await context.close();
            }

            const context = await browser.newContext({ viewport: { width: 720, height: 900 }, reducedMotion: 'reduce' });
            await context.addInitScript((key) => localStorage.removeItem(key), confirmationKey);
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            await page.getByRole('radio', { name: /^Full,/ }).click();
            let runButton = page.getByRole('button', { name: 'Run full test' }).first();
            if ((await runButton.getAttribute('aria-haspopup')) !== 'dialog') failures.push('Full should require its first confirmation');
            await runButton.click();
            const dialog = page.getByRole('dialog');
            await dialog.waitFor({ state: 'visible' });
            const remember = dialog.getByRole('checkbox', { name: /Remember this choice/ });
            if (!(await remember.isChecked())) failures.push('Remember choice should default to enabled');
            await dialog.getByRole('button', { name: 'Run full test' }).click();
            await page.waitForTimeout(100);

            const stored = await page.evaluate((key) => JSON.parse(localStorage.getItem(key) || '{}'), confirmationKey);
            if (typeof stored.standard !== 'number' || stored.standard < 1_156_000_000) failures.push('Full confirmation was not remembered at the current cap');

            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('radio', { name: /^Full,/ }).click();
            runButton = page.getByRole('button', { name: 'Run full test' }).first();
            if ((await runButton.getAttribute('aria-haspopup')) !== null) failures.push('Remembered Full run still announces a dialog');
            await runButton.click();
            await page.waitForTimeout(100);
            if (await dialog.isVisible()) failures.push('Remembered Full run reopened the dialog');

            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('radio', { name: /^Stress,/ }).click();
            runButton = page.getByRole('button', { name: 'Run stress test' }).first();
            await runButton.click();
            await dialog.waitFor({ state: 'visible' });
            const stressRemember = dialog.getByRole('checkbox', { name: /Remember this choice/ });
            await stressRemember.uncheck();
            await dialog.getByRole('button', { name: 'Run stress test' }).click();
            await page.waitForTimeout(100);

            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('radio', { name: /^Stress,/ }).click();
            runButton = page.getByRole('button', { name: 'Run stress test' }).first();
            if ((await runButton.getAttribute('aria-haspopup')) !== 'dialog') failures.push('Unremembered Stress run should still announce a dialog');
            await runButton.click();
            await dialog.waitFor({ state: 'visible' });
            await dialog.getByRole('button', { name: 'Cancel' }).click();

            await page.screenshot({ path: 'ui-regression/confirmation-state.png', fullPage: true });
            await context.close();
            await browser.close();

            fs.writeFileSync('ui-regression/report.json', JSON.stringify({ failures }, null, 2));
            if (failures.length) {
              console.error(failures);
              process.exitCode = 1;
            }
          })();
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: network-ui-regression
          path: ui-regression
          retention-days: 7
