name: One-time sync clip reveal

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-clip-reveal-menu' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-clip-reveal-menu
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin merged design-system commit
        env:
          WDS_SOURCE_COMMIT: 15380b6622d387dc07fa711fdb12325368104b51
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = os.environ['WDS_SOURCE_COMMIT']

          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = sha
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          source_path = Path('src/design-system/SOURCE.md')
          source = source_path.read_text()
          source, count = re.subn(r'Source commit: [0-9a-f]+', f'Source commit: {sha}', source, count=1)
          if count != 1:
              raise SystemExit('Could not update Network design-system source metadata')
          source_path.write_text(source)
          PY

      - name: Sync and validate generated assets
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
          npm run typecheck

      - name: Commit generated sync only
        run: |
          rm .github/workflows/one-time-sync-clip-reveal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.lock.json src/design-system scripts/design-system-* .github/workflows/one-time-sync-clip-reveal.yml
          git commit -m "Sync downward attached-menu reveal"
          git push origin HEAD:agent/sync-clip-reveal-menu
