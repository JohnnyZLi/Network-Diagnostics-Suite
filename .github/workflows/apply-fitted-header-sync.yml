name: Apply fitted header sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/fix-attached-control-visuals'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-attached-control-visuals
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run design-system:sync
      - run: npm run design-system:check
      - run: npm run design-system:integration
      - run: rm .github/workflows/apply-fitted-header-sync.yml
      - name: Commit generated sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync fitted attached header controls"
          git push origin HEAD:agent/fix-attached-control-visuals
