name: Debug minimum overflow

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/fix-attached-control-visuals'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/network-preview.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Identify overflow elements
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:320,height:700}, reducedMotion:'reduce'});
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            const inspect = async (label) => {
              const result = await page.evaluate(() => {
                const width = innerWidth;
                const nodes = [...document.querySelectorAll('body *')].map((el) => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return {
                    tag: el.tagName,
                    id: el.id,
                    cls: typeof el.className === 'string' ? el.className : '',
                    left: r.left,
                    right: r.right,
                    width: r.width,
                    scrollWidth: el.scrollWidth,
                    clientWidth: el.clientWidth,
                    position: s.position,
                    overflowX: s.overflowX,
                  };
                }).filter((x) => x.right > width + 1 || x.left < -1 || x.scrollWidth > x.clientWidth + 1)
                  .sort((a,b) => Math.max(b.right-width, b.scrollWidth-b.clientWidth) - Math.max(a.right-width, a.scrollWidth-a.clientWidth));
                return {innerWidth:width, docWidth:document.documentElement.scrollWidth, bodyWidth:document.body.scrollWidth, nodes:nodes.slice(0,40)};
              });
              console.log(`OVERFLOW ${label}:`, JSON.stringify(result, null, 2));
            };
            await inspect('initial');
            await page.locator('.jl-site-switcher__button').click();
            await inspect('sites-open');
            await page.keyboard.press('Escape');
            await page.locator('[data-settings-button]').click();
            await inspect('settings-open');
            await browser.close();
          })();
          NODE
