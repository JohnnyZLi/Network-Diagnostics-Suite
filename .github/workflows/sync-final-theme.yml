name: Synchronize final theme runtime

on:
  push:
    branches: ["feat/shared-web-dark-mode"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-web-dark-mode
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pin and synchronize runtime
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          old = '730fe5fc66de8321184ab7dae22c226a97d1aeb8'
          new = 'aca8bf9f4c5c2b93a123ac91ca804b4079ec64b9'
          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = new
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          source = Path('src/design-system/SOURCE.md')
          source.write_text(source.read_text().replace(old, new))
          docs = Path('docs/shared-web-theme.md')
          docs.write_text(docs.read_text().replace(old, new))
          PY
          npm run design-system:sync
          rm .github/workflows/sync-final-theme.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize final validated theme runtime"
          git push origin HEAD:feat/shared-web-dark-mode
