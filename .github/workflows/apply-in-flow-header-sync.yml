name: Apply in-flow header sync

on:
  push:
    branches:
      - agent/in-flow-expanding-header-controls
    paths:
      - .github/workflows/apply-in-flow-header-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/in-flow-expanding-header-controls
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run design-system:sync
      - run: npm run design-system:check
      - run: npm run design-system:integration
      - run: rm .github/workflows/apply-in-flow-header-sync.yml
      - name: Commit generated sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync in-flow header controls"
          git push origin HEAD:agent/in-flow-expanding-header-controls
