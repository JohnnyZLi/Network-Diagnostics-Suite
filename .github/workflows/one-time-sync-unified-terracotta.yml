name: One-time sync unified terracotta

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-unified-terracotta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Advance shared design-system pin
        run: |
          python - <<'PY'
          from pathlib import Path
          old='58e082a91caaf77ff88823afd5fc79a16badaf47'
          new='4f4a0be8fb055de593492f9873619f232653d1f5'
          for name in ['design-system.lock.json','src/design-system/SOURCE.md']:
              p=Path(name)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'{name} missing old pin')
              p.write_text(s.replace(old,new))
          PY
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:check
          npm run design-system:integration
          npm run typecheck
          git diff --check
      - name: Commit synced assets
        run: |
          rm .github/workflows/one-time-sync-unified-terracotta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.lock.json src/design-system scripts/design-system-consumer-release.mjs scripts/design-system-conformance-runner.mjs scripts/design-system-conformance-contract.json .github/workflows/one-time-sync-unified-terracotta.yml
          git commit -m "Sync unified terracotta design tokens"
          git push origin HEAD:${{ github.head_ref }}
