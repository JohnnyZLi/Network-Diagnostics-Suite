name: Visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/network-preview.log 2>&1 &
          echo $! > /tmp/network-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/network-preview.log
          exit 1
      - name: Capture and verify application states
        run: |
          mkdir -p visual-audit
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['narrow-desktop', { width: 720, height: 900 }],
            ['mobile', { width: 390, height: 844 }],
            ['minimum', { width: 320, height: 700 }],
          ];
          const historySeed = [
            {
              id: 'visual-r2',
              startedAt: '2026-07-27T03:00:00.000Z',
              completedAt: '2026-07-27T03:00:20.000Z',
              mode: 'quick',
              download: { steadyMbps: 420, stabilityPercent: 94, delivery: { selectedPath: 'r2-direct-v1' } },
              upload: { steadyMbps: 48 },
              downloadLatency: { increaseMs: 12 },
            },
            {
              id: 'visual-worker',
              startedAt: '2026-07-26T03:00:00.000Z',
              completedAt: '2026-07-26T03:00:20.000Z',
              mode: 'full',
              download: { steadyMbps: 310, stabilityPercent: 89, delivery: { selectedPath: 'worker-stream-v4' } },
              upload: { steadyMbps: 44 },
              downloadLatency: { increaseMs: 21 },
            },
          ];
          const near = (actual, expected, tolerance = 0.75) =>
            typeof actual === 'number' && Math.abs(actual - expected) <= tolerance;

          async function inspect(page, viewportName, prefix) {
            const problems = [];
            await page.locator('.test-controls').waitFor({ state: 'visible' });
            await page.screenshot({ path: `visual-audit/${prefix}-home-${viewportName}.png`, fullPage: true });

            const profileGeometry = [];
            const expectedCaps = { Full: '1.2 GB', Stress: '3.5 GB' };
            for (const profile of ['Quick', 'Full', 'Stress']) {
              await page.getByRole('radio', { name: new RegExp(`^${profile}(?:,|$)`) }).click();
              await page.waitForTimeout(50);
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'auto' }));
              const geometry = await page.evaluate(() => {
                const readRect = (selector) => {
                  const element = document.querySelector(selector);
                  if (!(element instanceof HTMLElement)) return null;
                  const rect = element.getBoundingClientRect();
                  return { top: rect.top + window.scrollY, height: rect.height };
                };
                return {
                  heroCopy: readRect('.hero__copy'),
                  controls: readRect('.test-controls'),
                  dataUse: readRect('.data-use-note'),
                  runButton: readRect('.run-button'),
                };
              });
              profileGeometry.push({ profile, ...geometry });
              await page.locator('.test-controls').screenshot({ path: `visual-audit/${prefix}-profile-${profile.toLowerCase()}-${viewportName}.png` });

              if (prefix === 'local') {
                const runButton = page.getByRole('button', { name: `Run ${profile.toLowerCase()} test` });
                const dialog = page.getByRole('dialog');
                if (profile === 'Quick') {
                  if ((await runButton.getAttribute('aria-haspopup')) !== null) problems.push('Quick run button exposes an unnecessary dialog affordance');
                  if (await dialog.isVisible()) problems.push('Quick profile left the confirmation dialog open');
                } else {
                  if ((await runButton.getAttribute('aria-haspopup')) !== 'dialog') problems.push(`${profile} run button does not announce its dialog`);
                  await runButton.click();
                  await dialog.waitFor({ state: 'visible' });
                  if (!(await dialog.getByRole('heading', { name: `Run the ${profile} test?` }).isVisible())) problems.push(`${profile} confirmation heading is missing`);
                  if (!(await dialog.getByText(expectedCaps[profile], { exact: false }).isVisible())) problems.push(`${profile} confirmation does not show its transfer cap`);
                  const cancelButton = dialog.getByRole('button', { name: 'Cancel' });
                  if (!(await cancelButton.evaluate((element) => document.activeElement === element))) problems.push(`${profile} dialog did not focus Cancel first`);
                  const dialogGeometry = await dialog.evaluate((element) => {
                    const rect = element.getBoundingClientRect();
                    return { left: rect.left, right: rect.right, bottom: rect.bottom, width: rect.width };
                  });
                  if (viewportName === 'mobile') {
                    if (!near(dialogGeometry.width, 366, 1)) problems.push(`${profile} mobile sheet width ${dialogGeometry.width}`);
                    if (!near(dialogGeometry.bottom, 832, 1)) problems.push(`${profile} mobile sheet bottom ${dialogGeometry.bottom}`);
                  }
                  await page.screenshot({ path: `visual-audit/${prefix}-profile-${profile.toLowerCase()}-confirmation-${viewportName}.png` });
                  await page.keyboard.press('Escape');
                  if (await dialog.isVisible()) problems.push(`${profile} confirmation did not close with Escape`);
                  if (!(await runButton.evaluate((element) => document.activeElement === element))) problems.push(`${profile} run button did not regain focus after Escape`);
                  await runButton.click();
                  await dialog.waitFor({ state: 'visible' });
                  await dialog.getByRole('button', { name: 'Cancel' }).click();
                  if (await dialog.isVisible()) problems.push(`${profile} confirmation did not close with Cancel`);
                  if (!(await runButton.evaluate((element) => document.activeElement === element))) problems.push(`${profile} run button did not regain focus after Cancel`);
                }
              }
            }

            if (prefix === 'local') {
              const baseline = profileGeometry[0];
              for (const entry of profileGeometry.slice(1)) {
                for (const area of ['heroCopy', 'controls', 'dataUse', 'runButton']) {
                  const expected = baseline[area];
                  const actual = entry[area];
                  if (!expected || !actual) {
                    problems.push(`${entry.profile} ${area} geometry is missing`);
                    continue;
                  }
                  if (!near(actual.top, expected.top, 1)) problems.push(`${entry.profile} moved ${area} from ${expected.top} to ${actual.top}`);
                  if (!near(actual.height, expected.height, 1)) problems.push(`${entry.profile} changed ${area} height from ${expected.height} to ${actual.height}`);
                }
              }
            }

            const advanced = page.locator('.advanced-path');
            await advanced.locator('summary').click();
            await advanced.screenshot({ path: `visual-audit/${prefix}-download-path-${viewportName}.png` });

            for (const [name, selector] of [
              ['measurement-preview', '.measurement-preview'],
              ['recent-results', '.recent-results'],
              ['methodology', '#methodology'],
              ['deep-probe', '.deep-probe'],
              ['privacy', '#privacy'],
            ]) {
              const locator = page.locator(selector).first();
              if ((await locator.count()) !== 1) {
                problems.push(`${name} state was not rendered`);
                continue;
              }
              await locator.scrollIntoViewIfNeeded();
              await locator.screenshot({ path: `visual-audit/${prefix}-${name}-${viewportName}.png` });
            }

            const metrics = await page.evaluate(() => {
              const bodyColor = getComputedStyle(document.body).color;
              return {
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                h1Count: document.querySelectorAll('h1').length,
                headerHeight: document.querySelector('.jl-global-header')?.getBoundingClientRect().height ?? null,
                headerInnerHeight: document.querySelector('.jl-global-header__inner')?.getBoundingClientRect().height ?? null,
                previewHeadingColors: [...document.querySelectorAll('.preview-grid h3')].map((element) => getComputedStyle(element).color),
                bodyColor,
                sitesButton: (() => {
                  const element = document.querySelector('.jl-site-switcher__button');
                  if (!(element instanceof HTMLElement)) return null;
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return { width: rect.width, height: rect.height, fontSize: style.fontSize, fontWeight: style.fontWeight };
                })(),
              };
            });

            const compact = viewportName === 'mobile' || viewportName === 'minimum';
            const expectedInnerHeight = compact ? 68 : 82;
            const expectedOuterHeight = compact ? 82 : 83;
            const expectedButtonHeight = compact ? 40 : 44;
            const fittedSitesWidth = 88;
            const legacySitesWidth = metrics.viewportWidth <= 420 ? 116 : 136;
            if (metrics.overflow) problems.push('document overflow');
            if (metrics.h1Count !== 1) problems.push(`expected one h1, found ${metrics.h1Count}`);
            if (!near(metrics.headerInnerHeight, expectedInnerHeight)) problems.push(`header inner ${metrics.headerInnerHeight}, expected ${expectedInnerHeight}`);
            if (!near(metrics.headerHeight, expectedOuterHeight)) problems.push(`header outer ${metrics.headerHeight}, expected ${expectedOuterHeight}`);
            if (!metrics.sitesButton) {
              problems.push('Sites button missing');
            } else {
              const widthAllowed = prefix === 'local'
                ? near(metrics.sitesButton.width, fittedSitesWidth)
                : near(metrics.sitesButton.width, fittedSitesWidth) || near(metrics.sitesButton.width, legacySitesWidth);
              if (!widthAllowed) problems.push(`Sites width ${metrics.sitesButton.width}`);
              if (!near(metrics.sitesButton.height, expectedButtonHeight)) problems.push(`Sites height ${metrics.sitesButton.height}, expected ${expectedButtonHeight}`);
              if (metrics.sitesButton.fontSize !== '13px') problems.push(`Sites font size ${metrics.sitesButton.fontSize}`);
              if (metrics.sitesButton.fontWeight !== '700') problems.push(`Sites font weight ${metrics.sitesButton.fontWeight}`);
            }
            if (metrics.previewHeadingColors.length !== 3 || metrics.previewHeadingColors.some((color) => color !== metrics.bodyColor)) problems.push('explanatory preview headings are not using the neutral text color');

            const sitesButton = page.locator('.jl-site-switcher__button');
            const sitesMenu = page.locator('#owned-sites-menu');
            await sitesButton.click();
            await sitesMenu.waitFor({ state: 'visible' });
            if ((await sitesMenu.locator('a').count()) !== 3) problems.push('Sites menu does not contain three links');
            if ((await sitesMenu.locator('a[aria-current="page"]').count()) !== 1) problems.push('Sites menu current-page state is incorrect');
            const sitesOpenGeometry = await page.evaluate(() => {
              const button = document.querySelector('.jl-site-switcher__button');
              const menu = document.querySelector('#owned-sites-menu');
              const links = [...document.querySelectorAll('#owned-sites-menu a')];
              const buttonRect = button?.getBoundingClientRect();
              const menuRect = menu?.getBoundingClientRect();
              return {
                buttonWidth: buttonRect?.width ?? null,
                buttonLeft: buttonRect?.left ?? null,
                buttonRight: buttonRect?.right ?? null,
                menuWidth: menuRect?.width ?? null,
                menuLeft: menuRect?.left ?? null,
                menuRight: menuRect?.right ?? null,
                viewportWidth: window.innerWidth,
                linkOverflow: links.some((link) => link.scrollWidth > link.clientWidth + 1),
              };
            });
            if (prefix === 'local') {
              if (!near(sitesOpenGeometry.buttonWidth, 88)) problems.push(`Sites trigger width ${sitesOpenGeometry.buttonWidth}`);
              if (!near(sitesOpenGeometry.menuWidth, 88)) problems.push(`Sites dropdown width ${sitesOpenGeometry.menuWidth}`);
              if (!near(sitesOpenGeometry.menuLeft, sitesOpenGeometry.buttonLeft) || !near(sitesOpenGeometry.menuRight, sitesOpenGeometry.buttonRight)) problems.push('Sites dropdown is not attached directly beneath its trigger');
              if (sitesOpenGeometry.menuLeft < -0.5 || sitesOpenGeometry.menuRight > sitesOpenGeometry.viewportWidth + 0.5) problems.push('Sites dropdown escapes the viewport');
              if (sitesOpenGeometry.linkOverflow) problems.push('Sites label overflows its attached dropdown');
            }
            await page.screenshot({ path: `visual-audit/${prefix}-sites-open-${viewportName}.png` });
            await page.keyboard.press('Escape');
            if (await sitesMenu.isVisible()) problems.push('Sites menu did not close with Escape');
            if (!(await sitesButton.evaluate((element) => document.activeElement === element))) problems.push('Sites button did not regain focus after Escape');

            const settingsButton = page.locator('[data-settings-button]');
            const settingsMenu = page.locator('[data-settings-menu]');
            await settingsButton.click();
            await settingsMenu.waitFor({ state: 'visible' });
            if ((await settingsMenu.locator('[data-theme-preference]').count()) !== 3) problems.push('Settings rail does not contain three theme options');
            const settingsOpenGeometry = await page.evaluate(() => {
              const button = document.querySelector('[data-settings-button]');
              const menu = document.querySelector('[data-settings-menu]');
              const style = button ? getComputedStyle(button) : null;
              return {
                buttonWidth: button?.getBoundingClientRect().width ?? null,
                menuWidth: menu?.getBoundingClientRect().width ?? null,
                focused: document.activeElement === button,
                boxShadow: style?.boxShadow ?? 'none',
              };
            });
            if (prefix === 'local') {
              if (!near(settingsOpenGeometry.buttonWidth, settingsOpenGeometry.menuWidth)) problems.push('Settings extension does not match trigger width');
              if (settingsOpenGeometry.focused && settingsOpenGeometry.boxShadow === 'none') problems.push('Open Settings trigger lost its complete inset focus treatment');
            }
            await page.screenshot({ path: `visual-audit/${prefix}-settings-open-${viewportName}.png` });
            await page.keyboard.press('Escape');
            if (await settingsMenu.isVisible()) problems.push('Settings rail did not close with Escape');
            if (!(await settingsButton.evaluate((element) => document.activeElement === element))) problems.push('Settings button did not regain focus after Escape');

            const nav = page.locator('#primary-navigation');
            const navButton = page.locator('.nav-toggle');
            const compactNavigation = viewportName !== 'desktop';
            if (compactNavigation) {
              if (!(await navButton.isVisible())) problems.push('compact Menu button is hidden');
              await navButton.click();
              await nav.waitFor({ state: 'visible' });
              if ((await nav.locator('a').count()) !== 3) problems.push('compact navigation has the wrong link count');
              if ((await navButton.getAttribute('aria-expanded')) !== 'true') problems.push('compact Menu did not expose expanded state');
              await page.screenshot({ path: `visual-audit/${prefix}-navigation-open-${viewportName}.png` });
              await page.keyboard.press('Escape');
              if (await nav.isVisible()) problems.push('compact navigation did not close with Escape');
              if (!(await navButton.evaluate((element) => document.activeElement === element))) problems.push('compact Menu did not regain focus after Escape');
            } else {
              if (await navButton.isVisible()) problems.push('desktop Menu button should be hidden');
              if (!(await nav.isVisible())) problems.push('desktop navigation should be visible');
            }

            return { viewportName, ...metrics, profileGeometry, problems };
          }

          async function auditBase(browser, baseUrl, prefix, viewportSet) {
            const report = [];
            for (const [viewportName, viewport] of viewportSet) {
              const context = await browser.newContext({ viewport, reducedMotion: 'reduce' });
              await context.addInitScript((seed) => {
                localStorage.setItem('network-diagnostics.recent-results.v1', JSON.stringify(seed));
              }, historySeed);
              const page = await context.newPage();
              const response = await page.goto(baseUrl, { waitUntil: 'networkidle' });
              const entry = await inspect(page, viewportName, prefix);
              if (!response || !response.ok()) entry.problems.push(`HTTP ${response?.status() ?? 'no response'}`);
              report.push(entry);
              await context.close();
            }
            return report;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const localReport = await auditBase(browser, 'http://127.0.0.1:4173/', 'local', viewports);
            const productionReport = await auditBase(browser, 'https://network.johnnyli.dev/', 'production', [viewports[0], viewports[2]]);
            fs.writeFileSync('visual-audit/report.json', JSON.stringify({ local: localReport, production: productionReport }, null, 2));
            const failures = [...localReport, ...productionReport].filter((entry) => entry.problems.length > 0);
            if (failures.length) {
              console.error('Rendered contract failures:', failures);
              process.exitCode = 1;
            }
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: network-visual-audit
          path: visual-audit
          retention-days: 7
