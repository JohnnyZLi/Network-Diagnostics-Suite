name: Design system sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 16 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: JohnnyZLi/Web-Design-System/.github/workflows/consumer-design-system-sync.yml@44615631b9f8500ebb86c1ead803cecc91a497d3
    with:
      node-version: "24"
      timeout-minutes: 20
      install-command: npm ci --no-audit --no-fund
      validate-command: npm run design-system:check && npm run design-system:integration && npm run design-system:conformance && npm run typecheck && npm test && npm run build
      tracked-paths: |
        design-system.lock.json
        design-system.conformance.json
        scripts/design-system-consumer-release.mjs
        scripts/design-system-conformance-runner.mjs
        scripts/design-system-conformance-contract.json
        src/design-system
      product-name: Network Diagnostics
