name: Design system sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 16 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: JohnnyZLi/Web-Design-System/.github/workflows/consumer-design-system-sync.yml@15d831f437785e22419765c025e7b53abd3a2c61
    with:
      node-version: "24"
      timeout-minutes: 20
      install-command: npm ci --no-audit --no-fund
      validate-command: npm run design-system:check && npm run design-system:integration && npm run typecheck && npm test && npm run build
      tracked-paths: |
        design-system.lock.json
        scripts/design-system-consumer-release.mjs
        src/design-system
      product-name: Network Diagnostics
