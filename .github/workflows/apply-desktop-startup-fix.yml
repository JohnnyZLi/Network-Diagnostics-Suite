name: Apply desktop startup fix

on:
  push:
    branches:
      - agent/fix-desktop-startup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-desktop-startup
      - name: Apply focused startup correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/NetworkDiagnostics.Desktop/MainWindow.axaml.cs")
          source = path.read_text(encoding="utf-8")

          loader_using = "using Avalonia.Markup.Xaml;\n"
          loader_call = "        AvaloniaXamlLoader.Load(this);"
          initializer_call = "        InitializeComponent();"

          if loader_using not in source:
              raise SystemExit("Expected Avalonia XAML loader using was not found")
          if loader_call not in source:
              raise SystemExit("Expected direct XAML loader call was not found")

          source = source.replace(loader_using, "", 1)
          source = source.replace(loader_call, initializer_call, 1)
          path.write_text(source, encoding="utf-8")
          PY

          rm .github/workflows/apply-desktop-startup-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/NetworkDiagnostics.Desktop/MainWindow.axaml.cs .github/workflows/apply-desktop-startup-fix.yml
          git commit -m "Fix desktop window initialization"
          git push origin HEAD:agent/fix-desktop-startup
