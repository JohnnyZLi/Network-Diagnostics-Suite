name: Sync content-driven disclosures

on:
  push:
    branches:
      - agent/sync-content-driven-disclosures

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-content-driven-disclosures
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run design-system:update
      - name: Update generated source metadata
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('design-system.lock.json', 'utf8'));
          const path = 'src/design-system/SOURCE.md';
          let content = await readFile(path, 'utf8');
          content = content.replace(/Source commit: [0-9a-f]{40}/, `Source commit: ${lock.sourceCommit}`);
          content = content.replace(/Version: \d+\.\d+\.\d+/, `Version: ${lock.version}`);
          await writeFile(path, content, 'utf8');
          NODE
      - run: npm run design-system:sync
      - run: npm run design-system:check
      - run: npm run design-system:integration

      - name: Remove one-time workflow
        run: rm .github/workflows/sync-content-driven-disclosures.yml

      - name: Commit synced design system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync content-driven header disclosures"
          git push origin HEAD:agent/sync-content-driven-disclosures
