name: One-time sync pinned site controls

on:
  push:
    branches:
      - agent/sync-pinned-site-controls

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-pinned-site-controls
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin merged design-system commit
        env:
          WDS_SOURCE_COMMIT: 539ab47fae9f38faa41efef29b7d66de2bcfac75
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = os.environ['WDS_SOURCE_COMMIT']

          lock_path = Path('design-system.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sourceCommit'] = sha
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          source_path = Path('src/design-system/SOURCE.md')
          text = source_path.read_text()
          text, count = re.subn(r'Source commit: [0-9a-f]+', f'Source commit: {sha}', text, count=1)
          if count != 1:
              raise SystemExit('Could not update Network Diagnostics design-system source metadata')
          source_path.write_text(text)
          PY

      - name: Sync and validate generated assets
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          npm run design-system:check
          npm run design-system:integration

      - name: Commit generated sync only
        run: |
          git rm .github/workflows/one-time-sync-pinned-site-controls.yml
          rm -f .sync-pinned-controls-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync pinned shared header controls"
          git push origin HEAD:agent/sync-pinned-site-controls

# Triggered after PR creation so the generated sync is captured in the PR.
