name: PR animated-header design-system sync

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-animated-header-dismissal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/sync-animated-header-dismissal
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve latest reviewed design system
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:update
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('design-system.lock.json', 'utf8'));
          fs.writeFileSync('src/design-system/SOURCE.md', [
            '# Generated design-system assets',
            '',
            'Do not edit these files directly.',
            '',
            `Package: ${lock.package}`,
            `Version: ${lock.version}`,
            `Source commit: ${lock.sourceCommit}`,
            '',
            'Validate with `npm run design-system:check`.',
            '',
          ].join('\n'));
          NODE
      - name: Synchronize and validate
        run: |
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
      - name: Commit synchronized assets and remove this workflow
        run: |
          rm .github/workflows/pr-sync-animated-header-dismissal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync animated header dismissal"
          npm run design-system:check
          git push origin HEAD:agent/sync-animated-header-dismissal
