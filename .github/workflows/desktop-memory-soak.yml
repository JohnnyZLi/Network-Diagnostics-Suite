name: Desktop memory soak

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-memory-soak.yml'
      - 'tools/NetworkDiagnostics.Desktop/**'
      - 'tools/NetworkDiagnostics.Core/**'
      - 'tools/DeepProbe/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DISPLAY: ':99'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GTK_THEME: 'Adwaita:dark'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3
        with:
          dotnet-version: '10.0.x'

      - name: Install Photino Linux host and virtual desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev \
            xvfb openbox wmctrl scrot

      - name: Publish Linux desktop application
        run: |
          dotnet publish tools/NetworkDiagnostics.Desktop/NetworkDiagnostics.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output desktop-memory-soak/publish
          test -f desktop-memory-soak/publish/wwwroot/index.html

      - name: Run Photino process-tree idle soak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-memory-soak/artifacts
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp > /tmp/memory-xvfb.log 2>&1 &
          sleep 1
          openbox > /tmp/memory-openbox.log 2>&1 &
          sleep 1

          desktop-memory-soak/publish/NetworkDiagnosticsDesktop > /tmp/memory-app.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/memory-app.pid

          window_found=false
          for attempt in {1..60}; do
            if wmctrl -l | grep -q 'Network Diagnostics'; then
              wmctrl -r 'Network Diagnostics' -b add,maximized_vert,maximized_horz
              window_found=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/memory-app.log
              exit 1
            fi
            sleep 1
          done
          if [ "$window_found" != true ]; then
            cat /tmp/memory-app.log
            exit 1
          fi

          collect_tree_pids() {
            local root_pid="$1"
            local -a frontier=("$root_pid")
            local -a all=("$root_pid")
            local -a next=()
            local parent child

            while ((${#frontier[@]} > 0)); do
              next=()
              for parent in "${frontier[@]}"; do
                while read -r child; do
                  if [[ -n "$child" ]]; then
                    next+=("$child")
                    all+=("$child")
                  fi
                done < <(ps -eo pid=,ppid= | awk -v parent="$parent" '$2 == parent { print $1 }')
              done
              frontier=("${next[@]}")
            done

            printf '%s\n' "${all[@]}"
          }

          sample_tree() {
            local -a pids=()
            local pid_csv
            mapfile -t pids < <(collect_tree_pids "$app_pid")
            pid_csv=$(IFS=,; echo "${pids[*]}")
            ps -o rss=,vsz=,%cpu= -p "$pid_csv" \
              | awk -v count="${#pids[@]}" '{rss += $1; vsz += $2; cpu += $3} END {printf "%d %d %.1f %d\n", rss, vsz, cpu, count}'
          }

          snapshot_tree() {
            local output="$1"
            local -a pids=()
            local pid_csv
            mapfile -t pids < <(collect_tree_pids "$app_pid")
            pid_csv=$(IFS=,; echo "${pids[*]}")
            ps -o pid=,ppid=,rss=,vsz=,%cpu=,comm= -p "$pid_csv" > "$output"
          }

          # Let .NET, WebKit, the JS runtime, and native helper processes settle.
          sleep 45
          scrot desktop-memory-soak/artifacts/soak-start.png
          snapshot_tree desktop-memory-soak/artifacts/processes-start.txt

          read -r baseline_rss baseline_vsz baseline_cpu baseline_count < <(sample_tree)
          printf 'elapsed_seconds\trss_kb\tvsz_kb\tcpu_percent\tprocess_count\n' \
            > desktop-memory-soak/artifacts/memory.tsv
          printf '0\t%s\t%s\t%s\t%s\n' "$baseline_rss" "$baseline_vsz" "$baseline_cpu" "$baseline_count" \
            >> desktop-memory-soak/artifacts/memory.tsv

          peak_rss=$baseline_rss
          final_rss=$baseline_rss
          final_cpu=$baseline_cpu
          final_count=$baseline_count
          for sample in {1..60}; do
            sleep 10
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/memory-app.log
              exit 1
            fi
            read -r rss vsz cpu count < <(sample_tree)
            elapsed=$((sample * 10))
            printf '%s\t%s\t%s\t%s\t%s\n' "$elapsed" "$rss" "$vsz" "$cpu" "$count" \
              >> desktop-memory-soak/artifacts/memory.tsv
            if (( rss > peak_rss )); then peak_rss=$rss; fi
            final_rss=$rss
            final_cpu=$cpu
            final_count=$count
          done

          snapshot_tree desktop-memory-soak/artifacts/processes-end.txt
          scrot desktop-memory-soak/artifacts/soak-end.png
          growth_kb=$((final_rss - baseline_rss))
          echo "Baseline process-tree RSS: ${baseline_rss} KB (${baseline_count} processes)"
          echo "Final process-tree RSS:    ${final_rss} KB (${final_count} processes)"
          echo "Peak process-tree RSS:     ${peak_rss} KB"
          echo "Process-tree growth:       ${growth_kb} KB"
          echo "Final process-tree CPU:    ${final_cpu}%"

          if (( final_rss > 2097152 )); then
            echo "Photino process tree exceeded the 2 GB idle RSS safety ceiling."
            exit 1
          fi
          if (( growth_kb > 524288 )); then
            echo "Photino process tree retained more than 512 MB during the settled soak."
            exit 1
          fi
          if awk "BEGIN {exit !($final_cpu > 80)}"; then
            echo "Photino process tree remained above the idle CPU safety ceiling."
            exit 1
          fi
          if grep -Ei 'unhandled exception|fatal error|segmentation fault' /tmp/memory-app.log; then
            cat /tmp/memory-app.log
            exit 1
          fi

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desktop-photino-memory-soak
          path: |
            desktop-memory-soak/artifacts
            /tmp/memory-app.log
            /tmp/memory-openbox.log
            /tmp/memory-xvfb.log
          retention-days: 7
