name: Apply shared web theme

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/shared-web-dark-mode' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-web-dark-mode
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Apply shared theme
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          sha = 'd77a0d73981fc7e38e0ad8271efc2537057d516a'
          Path('design-system.lock.json').write_text(json.dumps({
              'package': '@johnnyzli/web-design-system',
              'version': '1.9.0',
              'sourceCommit': sha,
          }, indent=2) + '\n')

          sync = Path('scripts/check-design-system.mjs')
          text = sync.read_text()
          text = text.replace(
              '["styles/site-identity.css", "src/design-system/site-identity.css"],',
              '["styles/site-identity.css", "src/design-system/site-identity.css"],\n  ["styles/theme-control.css", "src/design-system/theme-control.css"],'
          )
          text = text.replace(
              '["scripts/site-controls.js", "src/design-system/site-controls.js"],',
              '["scripts/site-controls.js", "src/design-system/site-controls.js"],\n  ["scripts/theme-bootstrap.js", "src/design-system/theme-bootstrap.js"],'
          )
          sync.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace(
              '<meta name="theme-color" content="#f2efe8" />',
              '<meta name="theme-color" content="#f2efe8" data-theme-light="#f2efe8" data-theme-dark="#171714" />'
          )
          text = text.replace(
              '<link rel="manifest" href="/site.webmanifest" />',
              '<link rel="manifest" href="/site.webmanifest" />\n    <script src="/src/design-system/theme-bootstrap.js"></script>'
          )
          index.write_text(text)

          main = Path('src/main.tsx')
          text = main.read_text().replace(
              'import "./design-system/site-identity.css";',
              'import "./design-system/site-identity.css";\nimport "./design-system/theme-control.css";'
          )
          main.write_text(text)

          manifest_path = Path('design-system.conformance.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['rules']['DS-THEME-001'] = {'evidence': [
              {'type': 'contains', 'file': 'index.html', 'values': ['theme-bootstrap.js', 'data-theme-light', 'data-theme-dark']},
              {'type': 'contains', 'file': 'src/main.tsx', 'value': 'theme-control.css'},
              {'type': 'contains', 'file': 'scripts/check-design-system.mjs', 'values': ['theme-bootstrap.js', 'theme-control.css']},
          ]}
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          npm run design-system:sync
          rm .github/workflows/apply-shared-web-theme.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Adopt shared web appearance modes"
          git push origin HEAD:feat/shared-web-dark-mode
