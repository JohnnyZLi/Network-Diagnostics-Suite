name: Source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/source-snapshot.yml'
      - '.automation/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'package*.json'
      - 'tsconfig*.json'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/desktop-app-rebuild
          fetch-depth: 0
      - name: Apply staged source patch
        run: |
          if [ -f .automation/apply ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cat .automation/gz/* | base64 --decode | gzip -dc > /tmp/source.patch
            git apply --index /tmp/source.patch
            git rm -r .automation/gz .automation/apply
            git commit -m "Apply validated implementation tranche"
            git push origin HEAD:agent/desktop-app-rebuild
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-snapshot
          path: |
            .github
            contracts
            docs
            src
            tests
            tools
            worker
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          retention-days: 1
          if-no-files-found: error
