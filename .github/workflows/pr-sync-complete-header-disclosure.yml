name: PR complete-header design-system sync

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-complete-header-disclosure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/sync-complete-header-disclosure
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and resolve latest reviewed design system
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:update
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          lock = json.loads(Path("design-system.lock.json").read_text(encoding="utf-8"))
          path = Path("src/design-system/SOURCE.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"Source commit: [0-9a-f]+", f"Source commit: {lock['sourceCommit']}", text, count=1)
          text = re.sub(r"Version: \d+\.\d+\.\d+", f"Version: {lock['version']}", text, count=1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Synchronize and pre-commit validate
        run: |
          npm run design-system:sync
          npm run design-system:integration
          npm run design-system:conformance
      - name: Commit synchronized assets and remove this workflow
        run: |
          rm .github/workflows/pr-sync-complete-header-disclosure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync complete-header disclosure behavior"
          npm run design-system:check
          git push origin HEAD:agent/sync-complete-header-disclosure
