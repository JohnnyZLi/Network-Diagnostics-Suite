name: Apply attached Sites sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sites-menu-attached-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/sites-menu-attached-sync
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Sync shared design system
        run: |
          npm ci --no-audit --no-fund
          npm run design-system:sync
          python3 .github/scripts/apply-sites-attached-contract.py
          git diff --check
      - name: Commit generated state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add design-system.lock.json src/design-system scripts/design-system-consumer-release.mjs scripts/design-system-conformance-runner.mjs scripts/design-system-conformance-contract.json scripts/validate-design-system-integration.mjs
          git commit -m "Sync attached Sites menu geometry"
          git push origin HEAD:agent/sites-menu-attached-sync
